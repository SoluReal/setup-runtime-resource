# The test job is the release gate and starts the test jobs.
release-gate: &release_gate [ test ]

# These tests can block a release; experimental tests run separately.
gating-tests: &gating_tests full simple gradle maven nodejs python rc-files

resources:
  - name: repo
    type: git
    icon: github
    source:
      uri: https://github.com/solureal/setup-runtime-resource.git
      branch: master

  - name: setup-runtime-resource-dev
    type: registry-image
    icon: docker
    source:
      repository: docker.io/solureal/setup-runtime-resource
      tag: dev
      username: ((dockerhub-libs-username))
      password: ((dockerhub-libs-password))

  - name: setup-runtime-resource
    type: registry-image
    icon: docker
    source:
      repository: docker.io/solureal/setup-runtime-resource
      tag: latest
      username: ((dockerhub-libs-username))
      password: ((dockerhub-libs-password))

  - name: version
    type: semver
    icon: tag
    source:
      uri: git@github.com:solureal/setup-runtime-resource
      private_key: ((github-private-key))
      branch: version
      driver: git
      file: version

  - name: repo-release
    type: github-release
    icon: package-variant-closed
    source:
      owner: solureal
      repository: setup-runtime-resource
      access_token: ((github-apitoken))

  # Broad smoke test; source comes from the test directory.
  - name: setup-runtime-full
    type: setup-runtime-resource
    icon: account-hard-hat
    source:
      ((SOURCE_FULL))

  # One resource for each test directory.
  - name: setup-runtime-simple
    type: setup-runtime-resource
    icon: account-hard-hat
    source:
      ((SOURCE_SIMPLE))

  - name: setup-runtime-gradle
    type: setup-runtime-resource
    icon: account-hard-hat
    source:
      ((SOURCE_GRADLE))

  - name: setup-runtime-maven
    type: setup-runtime-resource
    icon: account-hard-hat
    source:
      ((SOURCE_MAVEN))

  - name: setup-runtime-nodejs
    type: setup-runtime-resource
    icon: account-hard-hat
    source:
      ((SOURCE_NODEJS))

  - name: setup-runtime-python
    type: setup-runtime-resource
    icon: account-hard-hat
    source:
      ((SOURCE_PYTHON))

  - name: setup-runtime-rc-files
    type: setup-runtime-resource
    icon: account-hard-hat
    source:
      ((SOURCE_RC_FILES))

  - name: setup-runtime-testcontainers-rootless
    type: setup-runtime-resource
    icon: account-hard-hat
    source:
      ((SOURCE_TESTCONTAINERS_ROOTLESS))

  # The S3 test uses the local emulator here and deployment-provided settings in CI.
  - name: setup-runtime-s3-cache
    type: setup-runtime-resource
    icon: cloud-sync
    source:
      sdkman:
        enabled: true
      java:
        version: 21
      maven:
        version: 3.9.6
      gradle:
        wrapper: true
      verbose: true
      dependency_download_retries: 3
      s3_cache:
        enabled: true
        bucket: ((s3-cache-bucket))
        endpoint: ((s3-cache-endpoint))
        region: ((s3-cache-region))
        prefix: ((s3-cache-prefix))

  - name: pr-source
    type: github-pr
    icon: source-pull
    check_every: never
    webhook_token: ((github-webtoken))
    source:
      repo: solureal/setup-runtime-resource
      access_token: ((github-apitoken))
      private_key: ((github-private-key))
      base_branch: master

jobs:
  - name: build
    plan:
      - get: repo
        trigger: true
      - task: build
        privileged: true
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: concourse/oci-build-task
          params:
            IMAGE_PLATFORM: linux/arm64,linux/amd64
            OUTPUT_OCI: true
          caches:
            - path: cache
          inputs:
            - name: repo
              path: .
          outputs:
            - name: image
          run:
            path: build
      - put: setup-runtime-resource-dev
        params:
          image: image/image

  # Release gate; run each gating test twice to verify cache restoration.
  - name: test
    serial: true
    plan:
      - in_parallel:
        - get: setup-runtime-resource-dev
          passed: [ build ]
          trigger: true
        - get: repo
          passed: [ build ]
      - task: run-tests
        # Reuse the image built by the build job.
        image: setup-runtime-resource-dev
        file: repo/ci/tasks/run-tests.yml
        params:
          FLY_USERNAME: ((fly-username))
          FLY_PASSWORD: ((fly-password))
          # Name of this pipeline.
          PIPELINE: setup-runtime-resource
          TESTS: *gating_tests

  # Experimental tests run separately and cannot block a release.
  - name: test-experimental
    serial: true
    plan:
      - in_parallel:
        - get: setup-runtime-resource-dev
          passed: [ build ]
        - get: repo
          passed: [ build ]
      - task: run-tests
        image: setup-runtime-resource-dev
        file: repo/ci/tasks/run-tests.yml
        params:
          FLY_USERNAME: ((fly-username))
          FLY_PASSWORD: ((fly-password))
          PIPELINE: setup-runtime-resource
          TESTS: s3-cache testcontainers-rootless

  # Each test directory has a manually triggered job.
  - name: test-full
    serial: true
    plan:
      - in_parallel:
        - get: setup-runtime-full
        - get: repo
          passed: [ build ]
      - task: test-image
        image: setup-runtime-full
        privileged: true
        file: repo/example/tests/full/task.yml

  - name: test-simple
    serial: true
    plan:
      - in_parallel:
        - get: setup-runtime-simple
        - get: repo
          passed: [ build ]
      - task: test-image
        image: setup-runtime-simple
        privileged: true
        file: repo/example/tests/simple/task.yml

  - name: test-gradle
    serial: true
    plan:
      - in_parallel:
        - get: setup-runtime-gradle
        - get: repo
          passed: [ build ]
      - task: test-image
        image: setup-runtime-gradle
        privileged: true
        file: repo/example/tests/gradle/task.yml

  - name: test-maven
    serial: true
    plan:
      - in_parallel:
        - get: setup-runtime-maven
        - get: repo
          passed: [ build ]
      - task: test-image
        image: setup-runtime-maven
        privileged: true
        file: repo/example/tests/maven/task.yml

  - name: test-nodejs
    serial: true
    plan:
      - in_parallel:
        - get: setup-runtime-nodejs
        - get: repo
          passed: [ build ]
      - task: test-image
        image: setup-runtime-nodejs
        privileged: true
        file: repo/example/tests/nodejs/task.yml

  - name: test-python
    serial: true
    plan:
      - in_parallel:
        - get: setup-runtime-python
        - get: repo
          passed: [ build ]
      - task: test-image
        image: setup-runtime-python
        privileged: true
        file: repo/example/tests/python/task.yml

  - name: test-rc-files
    serial: true
    plan:
      - in_parallel:
        - get: setup-runtime-rc-files
        - get: repo
          passed: [ build ]
      - task: test-image
        image: setup-runtime-rc-files
        privileged: true
        file: repo/example/tests/rc-files/task.yml

  - name: test-testcontainers-rootless
    serial: true
    plan:
      - in_parallel:
        - get: setup-runtime-testcontainers-rootless
        - get: repo
          passed: [ build ]
      - task: test-image
        image: setup-runtime-testcontainers-rootless
        privileged: true
        file: repo/example/tests/testcontainers-rootless/task.yml

  - name: test-s3-cache
    serial: true
    plan:
      - in_parallel:
        - get: setup-runtime-s3-cache
        - get: repo
          passed: [ build ]
      # No task cache: the second run must restore from S3.
      - task: test-image
        image: setup-runtime-s3-cache
        privileged: true
        file: repo/example/tests/s3-cache/task.yml
        params:
          S3_CACHE_ACCESS_KEY_ID: ((s3-cache-access-key-id))
          S3_CACHE_SECRET_ACCESS_KEY: ((s3-cache-secret-access-key))

  - name: pr-build-and-test
    serial: true
    plan:
      - get: pr-source
        trigger: false # don't run on every PR created.
        params: { depth: 1 }
      - put: set-pending-status
        resource: pr-source
        params:
          path: pr-source
          status: pending
      - task: build
        privileged: true
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: concourse/oci-build-task
          params:
            IMAGE_PLATFORM: linux/arm64 # ,linux/amd64 disabled for speed now.
#            OUTPUT_OCI: true
            UNPACK_ROOTFS: true
          caches:
            - path: cache
          inputs:
            - name: pr-source
              path: .
          outputs:
            - name: image
          run:
            path: build
      - put: setup-runtime-resource-dev
        params:
          image: image/image.tar
      - get: setup-runtime-full
      - task: test-image
        image: setup-runtime-full
        privileged: true
        # PRs run one cold smoke test.
        file: pr-source/example/tests/full/task.yml
        input_mapping: { repo: pr-source }
    on_success:
      put: set-build-success-status
      resource: pr-source
      params:
        path: pr-source
        status: success
    on_failure:
      put: set-failure-status
      resource: pr-source
      params:
        path: pr-source
        status: failure

  - name: publish-major
    plan:
      - in_parallel:
        - get: repo
          passed: *release_gate
        - get: version
          params: { bump: major }
        - get: setup-runtime-resource-dev
          passed: *release_gate
          params:
            format: oci-layout
      - load_var: version
        file: version/version
      - in_parallel: &upload-release
        - put: setup-runtime-resource
          no_get: true
          params:
            image: setup-runtime-resource-dev/oci
            version: ((.:version))
            bump_aliases: true
        - put: repo-release
          no_get: true
          inputs: detect
          params:
            commitish: repo/.git/ref
            generate_release_notes: true
            name: version/version
            tag: version/version
            tag_prefix: v
      - put: version
        no_get: true
        inputs: detect
        params:
          file: version/version

  - name: publish-minor
    plan:
      - in_parallel:
        - get: repo
          passed: *release_gate
        - get: version
          params: { bump: minor }
        - get: setup-runtime-resource-dev
          passed: *release_gate
          params:
            format: oci-layout
      - load_var: version
        file: version/version
      - in_parallel: *upload-release
      - put: version
        no_get: true
        inputs: detect
        params:
          file: version/version

  - name: publish-patch
    plan:
      - in_parallel:
        - get: repo
          passed: *release_gate
        - get: version
          params: { bump: patch }
        - get: setup-runtime-resource-dev
          passed: *release_gate
          params: { format: oci-layout }
      - load_var: version
        file: version/version
      - in_parallel: *upload-release
      - put: version
        no_get: true
        inputs: detect
        params: { file: version/version }

resource_types:
  - name: setup-runtime-resource
    type: registry-image
    privileged: true
    source:
      repository: solureal/setup-runtime-resource
      tag: dev

  - name: github-pr
    type: registry-image
    source:
      repository: ((registry-url))/dockerhubproxy/github-pr
      username: ((registry-username))
      password: ((registry-password))

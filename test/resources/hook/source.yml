hook: |
  curl -fSL https://github.com/hairyhenderson/gomplate/releases/download/v4.3.3/gomplate_linux-$(uname -m | sed "s/x86_64/amd64/;s/aarch64/arm64/") -o /usr/local/bin/gomplate
  chmod +x /usr/local/bin/gomplate
dependencies:
  - wget
  - git
  - curl
dependency_download_retries: 3
verbose: true

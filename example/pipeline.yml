resource_types:
  - name: setup-runtime-resource
    type: registry-image
    source:
      repository: solureal/setup-runtime-resource
      tag: latest

resources:
  - name: setup-runtime
    type: setup-runtime-resource
    source:
      sdkman:
        enabled: true
      java:
        version: 21
      gradle:
        wrapper: true
      nvm:
        enabled: true
      nodejs:
        version: lts

  - name: source
    type: git
    source:
      uri: ((git-uri))

jobs:
  - name: build
    plan:
      - in_parallel:
          - get: setup-runtime
          - get: source
            trigger: true
      - task: build
        image: setup-runtime
        config:
          platform: linux
          inputs:
            - name: source
          # The resource points gradle, npm, pnpm and yarn at $CACHE_DIRECTORY, which is `cache`.
          caches:
            - path: cache
          run:
            path: bash
            args:
              - -ec
              - |
                cd source
                ./gradlew build
                npm ci
                npm run build

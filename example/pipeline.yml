# ci/pipeline.yml minus publishing, deployed by ../build-and-test.sh against docker-compose.yml.
# test-* jobs are manual because the `test` job runs each twice to verify cache restoration.
resource_types:
- name: setup-runtime-resource
  type: registry-image
  privileged: true
  source:
    repository: registry:5000/setup-runtime-resource
    tag: ((setup-runtime-resource-tag))
    insecure: true

resources:
# Image for the `test` job's task: it needs bash and curl, and building a rootfs just to run fly
# would be wasteful.
- name: setup-runtime-image
  type: registry-image
  icon: docker
  source:
    repository: registry:5000/setup-runtime-resource
    tag: ((setup-runtime-resource-tag))
    insecure: true

# One resource per example/tests/<dir>, configured from that dir's source.yml, which
# build-and-test.sh passes in as vars (as for ci/pipeline.yml).
- name: setup-runtime-full
  type: setup-runtime-resource
  icon: account-hard-hat
  source:
    ((SOURCE_FULL))

- name: setup-runtime-simple
  type: setup-runtime-resource
  icon: account-hard-hat
  source:
    ((SOURCE_SIMPLE))

- name: setup-runtime-gradle
  type: setup-runtime-resource
  icon: account-hard-hat
  source:
    ((SOURCE_GRADLE))

- name: setup-runtime-maven
  type: setup-runtime-resource
  icon: account-hard-hat
  source:
    ((SOURCE_MAVEN))

- name: setup-runtime-nodejs
  type: setup-runtime-resource
  icon: account-hard-hat
  source:
    ((SOURCE_NODEJS))

- name: setup-runtime-python
  type: setup-runtime-resource
  icon: account-hard-hat
  source:
    ((SOURCE_PYTHON))

- name: setup-runtime-rc-files
  type: setup-runtime-resource
  icon: account-hard-hat
  source:
    ((SOURCE_RC_FILES))

- name: setup-runtime-testcontainers-rootless
  type: setup-runtime-resource
  icon: account-hard-hat
  source:
    ((SOURCE_TESTCONTAINERS_ROOTLESS))

# The git-server serves this repository, so `repo` is laid out as in CI.
- name: repo
  type: git
  source:
    uri: http://git-server:3000/example.git

jobs:
- name: test
  serial: true
  plan:
  - in_parallel:
    - get: repo
    - get: setup-runtime-image
  - task: run-tests
    image: setup-runtime-image
    file: repo/ci/tasks/run-tests.yml
    params:
      FLY_USERNAME: test
      FLY_PASSWORD: test
      FLY_API_URL: http://web:8080
      PIPELINE: setup-runtime
      TESTS: ((tests))

# Everything below is triggered by the `test` job above, never on its own.
- name: test-full
  serial: true
  plan:
  - in_parallel:
    - get: repo
    - get: setup-runtime-full
  - task: test-image
    image: setup-runtime-full
    privileged: true
    file: repo/example/tests/full/task.yml

- name: test-simple
  serial: true
  plan:
  - in_parallel:
    - get: repo
    - get: setup-runtime-simple
  - task: test-image
    image: setup-runtime-simple
    privileged: true
    file: repo/example/tests/simple/task.yml

- name: test-gradle
  serial: true
  plan:
  - in_parallel:
    - get: repo
    - get: setup-runtime-gradle
  - task: test-image
    image: setup-runtime-gradle
    privileged: true
    file: repo/example/tests/gradle/task.yml

- name: test-maven
  serial: true
  plan:
  - in_parallel:
    - get: repo
    - get: setup-runtime-maven
  - task: test-image
    image: setup-runtime-maven
    privileged: true
    file: repo/example/tests/maven/task.yml

- name: test-nodejs
  serial: true
  plan:
  - in_parallel:
    - get: repo
    - get: setup-runtime-nodejs
  - task: test-image
    image: setup-runtime-nodejs
    privileged: true
    file: repo/example/tests/nodejs/task.yml

- name: test-python
  serial: true
  plan:
  - in_parallel:
    - get: repo
    - get: setup-runtime-python
  - task: test-image
    image: setup-runtime-python
    privileged: true
    file: repo/example/tests/python/task.yml

- name: test-rc-files
  serial: true
  plan:
  - in_parallel:
    - get: repo
    - get: setup-runtime-rc-files
  - task: test-image
    image: setup-runtime-rc-files
    privileged: true
    file: repo/example/tests/rc-files/task.yml

- name: test-testcontainers-rootless
  serial: true
  plan:
  - in_parallel:
    - get: repo
    - get: setup-runtime-testcontainers-rootless
  - task: test-image
    image: setup-runtime-testcontainers-rootless
    privileged: true
    file: repo/example/tests/testcontainers-rootless/task.yml

platform: linux

inputs:
  - name: repo

caches:
  - path: cache

params:
  DEBUG: true
  PROJECTS_DIR: example

run:
  path: bash
  args:
    - -ec
    - |
      source "repo/$PROJECTS_DIR/tests/assert.sh"

      pushd "repo/$PROJECTS_DIR/python"

      pyenv install --skip-existing

      pip install -r requirements.txt

      export PYTHONPATH=$PYTHONPATH:$(pwd)/src
      pytest

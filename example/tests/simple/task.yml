platform: linux

inputs:
  - name: repo

caches:
  - path: cache

params:
  DEBUG: true
  # The repository input contains the example projects.
  PROJECTS_DIR: example

run:
  path: bash
  args:
    - -ec
    - |
      source "repo/$PROJECTS_DIR/tests/assert.sh"

      # The smallest useful runtime: nodejs with a pinned yarn and nothing else.
      which yarn | assert_contains "yarn"
      yarn --version | assert_contains "4.10.2"

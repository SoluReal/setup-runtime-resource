platform: linux

inputs:
  - name: repo

caches:
  - path: cache

params:
  DEBUG: true
  # The repository input contains the example projects.
  PROJECTS_DIR: example
  GRADLE_PROP_org_gradle_parallel: false

run:
  path: bash
  args:
    - -ec
    - |
      source "repo/$PROJECTS_DIR/tests/assert.sh"

      pushd "repo/$PROJECTS_DIR/gradle"
      sdk env install
      ./gradlew clean build

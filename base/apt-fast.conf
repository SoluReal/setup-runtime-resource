DOWNLOADBEFORE=true
_MAXNUM=8
_MAXCONPERSRV=4

# apt-fast names debs after the URL, but apt looks for them with the epoch ("1%3a2.47.3") in the name.
_add_epochs() {
  local deb version
  for deb in *.deb; do
    version=$(dpkg-deb -f "$deb" Version)
    [[ "$version" == *:* ]] || continue
    mv -f "$deb" "$(dpkg-deb -f "$deb" Package)_${version//:/%3a}_$(dpkg-deb -f "$deb" Architecture).deb"
  done
}

_DOWNLOADER='aria2c --no-conf -c -j ${_MAXNUM} -x ${_MAXCONPERSRV} -i ${DLLIST} --connect-timeout=60 --timeout=60 -m0 --header "Accept: */*" -q ${ARIA2_EXTRA_ARGS:-}; _add_epochs'

# apt-fast drops its colors when stdout isn't a terminal (never, in Concourse); only the prefix keeps one.
aptfast_prefix=$'\e[0;32m[apt-fast]\e[0m'
